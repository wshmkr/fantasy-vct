<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#09090b}
.pane{position:relative;background:#ffffff0a;-webkit-backdrop-filter:blur(20px) saturate(140%);backdrop-filter:blur(20px) saturate(140%);box-shadow:0 1px 0 #ffffff0d inset,0 24px 64px #00000080}
.pane::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,#ffffff40,#ffffff1a 40%,#ffffff00 75%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.dev:hover{transform:translateY(-2px)}
</style>
</helmet>
<div style="position: relative; min-height: 900px; display: flex; align-items: center; justify-content: center; padding: 48px 16px; box-sizing: border-box; font-family: Geist, Inter, system-ui, sans-serif; color: #f4f4f5; background: radial-gradient(60rem 44rem at 0% 0%, #ffb47a1a, #ffb47a00 70%), radial-gradient(60rem 44rem at 100% 100%, #ff6a1a26, #ff6a1a00 70%), #09090b; --accent: {{accent}};">
  <div class="pane" style="width: 100%; max-width: 380px; border-radius: 20px; padding: 40px 32px 32px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 28px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px;">
      <div style="width: 52px; height: 52px; border-radius: 15px; background: var(--accent); display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 #ffffff66, 0 12px 32px color-mix(in srgb, var(--accent) 40%, transparent);">
        <svg width="26" height="26" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.5 12.5 7 7 12.5 1.5 7z" fill="#1c0d02"/></svg>
      </div>
      <div style="font-size: 24px; font-weight: 600; letter-spacing: -0.02em;">Fantasy VCT</div>
    </div>

    <sc-if value="{{isLogin}}" hint-placeholder-val="{{ true }}">
      <a href="Main.dc.html" style="width: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px 16px; border-radius: 10px; background: var(--accent); color: #1c0d02; font-size: 15px; font-weight: 600; text-decoration: none; box-shadow: inset 0 1px 0 #ffffff59, 0 8px 24px color-mix(in srgb, var(--accent) 30%, transparent);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" x2="3" y1="12" y2="12"></line></svg>
        Log in with Discord
      </a>
    </sc-if>

    <sc-if value="{{isNoAccess}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 4px 0 8px;">
        <div style="width: 56px; height: 56px; border-radius: 50%; background: #f871711a; box-shadow: inset 0 0 0 1px #f8717155; display: flex; align-items: center; justify-content: center;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </div>
        <div style="font-size: 15px; font-weight: 600;">No access</div>
        <div style="font-size: 13px; color: #a1a1aa;">@randomuser</div>
      </div>
    </sc-if>

    <sc-if value="{{isDev}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;">
        <sc-for list="{{devUsers}}" as="u" hint-placeholder-count="4">
          <a href="Main.dc.html" class="dev" aria-label="Log in as {{u.name}}" style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: #a1a1aa; font-size: 13px; transition: transform .18s ease-out;">
            <span style="{{u.style}}">{{u.initial}}</span>
            {{u.name}}
          </a>
        </sc-for>
      </div>
    </sc-if>
  </div>

  <svg aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.035; pointer-events: none;"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter><rect width="100%" height="100%" filter="url(#grain)"></rect></svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["discord","no-access","dev"],"default":"discord"},"accent":{"editor":"color","default":"#ff7a1a","options":["#ff7a1a","#ff5c1a","#ff9a3d","#f97316"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const state = this.props.state ?? 'discord';
    const devUsers = [
      ['Stephen', '#5b9ddf'], ['Jackey', '#95deae'], ['Amy', '#fab0d9'], ['Will', '#f5bf81'],
    ].map(([name, color]) => ({
      name, initial: name[0],
      style: 'width: 52px; height: 52px; border-radius: 50%; background: #2a2a30; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 600; color: #f4f4f5; box-shadow: 0 0 0 2px #131315, 0 0 0 4px ' + color + ';',
    }));
    return {
      accent: this.props.accent ?? '#ff7a1a',
      isLogin: state === 'discord',
      isNoAccess: state === 'no-access',
      isDev: state === 'dev',
      devUsers,
    };
  }
}
</script>
</body>
</html>
