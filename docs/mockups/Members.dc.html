<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Members</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#09090b}
.pane{position:relative;-webkit-backdrop-filter:blur(20px) saturate(140%);backdrop-filter:blur(20px) saturate(140%);box-shadow:0 1px 0 #ffffff0d inset,0 12px 32px #00000059}
.pane::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,#ffffff33,#ffffff1a 40%,#ffffff00 75%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.row:hover{background:#ffffff0a}
.row:hover .rm{opacity:1}
input::placeholder{color:#71717a}
</style>
</helmet>
<div style="position: relative; min-height: 900px; display: flex; flex-wrap: wrap; align-items: flex-start; align-content: flex-start; font-family: Geist, Inter, system-ui, sans-serif; color: #f4f4f5; background: radial-gradient(70rem 50rem at 0% 0%, #ffb47a14, #ffb47a00 70%), radial-gradient(70rem 50rem at 100% 100%, #ff6a1a1c, #ff6a1a00 70%), #09090b; --accent: {{accent}};">
  <div style="flex: 1 1 100%;">
    <dc-import name="SiteLogo" hint-size="100%,52px"></dc-import>
  </div>

  <main style="flex: 999 1 560px; min-width: 0; padding: 40px 48px; box-sizing: border-box;">
    <div style="max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px;">
      <h1 style="margin: 0; font-size: 30px; line-height: 36px; font-weight: 600; letter-spacing: -0.02em;">Members</h1>

      <form style="display: flex; gap: 10px;">
        <label for="add-user" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; padding: 0 14px; height: 44px; border-radius: 10px; background: #0f0f12; box-shadow: inset 0 0 0 1px #70707a;">
          <span style="color: #a1a1aa; font-size: 15px;">@</span>
          <input id="add-user" type="text" aria-label="Discord username" placeholder="discord username" style="flex: 1; min-width: 0; background: transparent; border: 0; color: #f4f4f5; font: inherit; font-size: 15px; outline: none;">
        </label>
        <button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: var(--accent); color: #1c0d02; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: inset 0 1px 0 #ffffff59;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
          Add
        </button>
      </form>

      <div class="pane" style="border-radius: 16px; background: #141417e0; padding: 6px;">
        <sc-for list="{{members}}" as="m" hint-placeholder-count="6">
          <div class="row" style="display: flex; align-items: center; gap: 14px; padding: 10px 12px; border-radius: 12px;">
            <span style="{{m.avatarStyle}}">{{m.initial}}</span>
            <div style="flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px;">
              <span style="{{m.nameStyle}}">{{m.name}}</span>
              <span style="font-size: 13px; color: #a1a1aa;">@{{m.username}}</span>
            </div>
            <sc-if value="{{m.isCommissioner}}" hint-placeholder-val="{{ false }}">
              <span title="Commissioner" aria-label="Commissioner" style="color: var(--accent); display: flex;">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z"></path><path d="M5 21h14"></path></svg>
              </span>
            </sc-if>
            <sc-if value="{{m.pending}}" hint-placeholder-val="{{ false }}">
              <span title="Hasn't logged in yet" aria-label="Pending" style="color: #a1a1aa; display: flex;">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
              </span>
            </sc-if>
            <sc-if value="{{m.removable}}" hint-placeholder-val="{{ true }}">
              <button type="button" class="rm" aria-label="Remove {{m.username}}" title="Remove" style="opacity: .35; width: 32px; height: 32px; border-radius: 10px; border: 0; background: transparent; color: #f87171; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: opacity .15s;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path><line x1="10" x2="10" y1="11" y2="17"></line><line x1="14" x2="14" y1="11" y2="17"></line></svg>
              </button>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </div>
  </main>

  <svg aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.035; pointer-events: none;"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter><rect width="100%" height="100%" filter="url(#grain)"></rect></svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff7a1a","options":["#ff7a1a","#ff5c1a","#ff9a3d","#f97316"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      { name: 'Stephen', username: 'stephen', commissioner: true },
      { name: 'Jackey', username: 'jackey' },
      { name: 'Amy', username: 'amyy' },
      { name: 'Will', username: 'will.gg' },
      { name: 'James', username: 'jamesk', pending: true },
      { name: 'Terrance', username: 'terrance_', pending: true },
    ];
    const members = rows.map((r) => ({
      ...r,
      initial: r.name[0],
      isCommissioner: !!r.commissioner,
      pending: !!r.pending,
      removable: !r.commissioner,
      avatarStyle: 'width: 36px; height: 36px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; ' +
        (r.pending ? 'background: transparent; color: #71717a; box-shadow: inset 0 0 0 1.5px #52525b; border: 1px dashed #52525b; box-sizing: border-box;' : 'background: #2a2a30; color: #f4f4f5; box-shadow: inset 0 1px 0 #ffffff1f;'),
      nameStyle: 'font-size: 15px; font-weight: 600; color: ' + (r.pending ? '#a1a1aa' : '#f4f4f5') + ';',
    }));
    return { accent: this.props.accent ?? '#ff7a1a', members };
  }
}
</script>
</body>
</html>
