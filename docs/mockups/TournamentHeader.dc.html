<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tournament header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<header style="width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; font-family: Geist, Inter, system-ui, sans-serif; color: #f4f4f5;">
  <div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap;">
    <div style="width: 44px; height: 44px; flex: none; border-radius: 12px; background: radial-gradient(circle at 50% 25%, #ff7a1a40, #ffffff0d 70%); border: 1px solid #ffffff2e; box-shadow: inset 0 1px 0 #ffffff33; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600;">C</div>
    <h1 style="margin: 0; font-size: 26px; line-height: 32px; font-weight: 600; letter-spacing: -0.02em;">Challengers NA Stage 1</h1>
    <span style="display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: #ff7a1a; color: #1c0d02; font-size: 12px; line-height: 16px; font-weight: 600; box-shadow: 0 4px 14px #ff7a1a55;">Live</span>
    <div style="flex: 1;"></div>
    <div title="Matches played" style="display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-radius: 10px; background: #ffffff0a; box-shadow: inset 0 0 0 1px #ffffff12;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path></svg>
      <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 600;">18<span style="color: #a1a1aa;">/32</span></span>
      <span style="width: 96px; height: 4px; border-radius: 4px; background: #ffffff14; overflow: hidden;"><span style="display: block; width: 56%; height: 100%; border-radius: 4px; background: #ff7a1a;"></span></span>
    </div>
    <div style="display: flex; align-items: center; padding-left: 6px;">
      <sc-for list="{{managers}}" as="m" hint-placeholder-count="8">
        <span title="{{m.name}}" style="{{m.style}}">{{m.initial}}</span>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Tournament sections" style="display: inline-flex; align-self: flex-start; gap: 3px; padding: 3px; border-radius: 11px; background: #ffffff0a; box-shadow: inset 0 0 0 1px #ffffff14;">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <a href="{{t.href}}" style="{{t.style}}">
        <sc-if value="{{t.isRosters}}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></sc-if>
        <sc-if value="{{t.isDraft}}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="14" rx="1"></rect><rect width="7" height="7" x="3" y="14" rx="1"></rect></svg></sc-if>
        <sc-if value="{{t.isTeams}}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path></svg></sc-if>
        <sc-if value="{{t.isSettings}}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7h-9"></path><path d="M14 17H5"></path><circle cx="17" cy="17" r="3"></circle><circle cx="7" cy="7" r="3"></circle></svg></sc-if>
        {{t.label}}
      </a>
    </sc-for>
  </nav>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tab":{"editor":"enum","options":["rosters","draft","teams","settings"],"default":"teams"},"$preview":{"width":1100,"height":110}}'>
class Component extends DCLogic {
  renderVals() {
    const tab = this.props.tab ?? 'teams';
    const managers = [
      ['Jackey', '#95deae'], ['Amy', '#fab0d9'], ['Will', '#f5bf81'], ['Stephen', '#5b9ddf'],
      ['James', '#cfbeff'], ['Terrance', '#72dee4'], ['Joseph', '#ffb1aa'], ['Kai', '#c8d386'],
    ].map(([name, color], i) => ({
      name, initial: name[0],
      style: 'width: 28px; height: 28px; border-radius: 50%; background: #2a2a30; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; box-shadow: 0 0 0 2px ' + color + ', 0 0 0 4px #0c0c0e;' + (i ? ' margin-left: -4px;' : ''),
    }));
    const lens = 'background: #ffffff17; color: #f4f4f5; box-shadow: inset 1px 1px 0 #ffffff47, inset -1px -1px 0 #ffffff0f, inset 0 0 0 1px #ffffff1a, 0 6px 16px #00000073;';
    const tabs = [
      ['rosters', 'Rosters', 'Rosters.dc.html'], ['draft', 'Draft', 'Draft.dc.html'],
      ['teams', 'Teams', 'Teams.dc.html'], ['settings', 'Settings', 'Settings.dc.html'],
    ].map(([key, label, href]) => ({
      key, label, href,
      isRosters: key === 'rosters', isDraft: key === 'draft', isTeams: key === 'teams', isSettings: key === 'settings',
      style: 'display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; text-decoration: none; ' + (key === tab ? lens : 'color: #a1a1aa;'),
    }));
    return { managers, tabs };
  }
}
</script>
</body>
</html>
