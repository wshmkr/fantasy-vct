<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Teams</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#09090b}
.pane{position:relative;background:#ffffff0a;-webkit-backdrop-filter:blur(20px) saturate(140%);backdrop-filter:blur(20px) saturate(140%);box-shadow:0 1px 0 #ffffff0d inset,0 10px 28px #00000059}
.pane::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,#ffffff33,#ffffff1a 40%,#ffffff00 75%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.p{transition:background .15s}
.p:hover{background:#ffffff0f}
.num{font-family:"Geist Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
input::placeholder{color:#71717a}
</style>
</helmet>
<div style="position: relative; min-height: 1060px; display: flex; flex-wrap: wrap; align-items: flex-start; align-content: flex-start; font-family: Geist, Inter, system-ui, sans-serif; color: #f4f4f5; background: radial-gradient(70rem 50rem at 0% 0%, #ffb47a14, #ffb47a00 70%), radial-gradient(70rem 50rem at 100% 100%, #ff6a1a1c, #ff6a1a00 70%), #09090b;">
  <div style="flex: 1 1 100%;">
    <dc-import name="SiteLogo" hint-size="100%,52px"></dc-import>
  </div>

  <main style="flex: 999 1 560px; min-width: 0; padding: 32px 40px 48px; box-sizing: border-box;">
    <div style="max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px;">
      <dc-import name="TournamentHeader" tab="teams" hint-size="100%,110px"></dc-import>

      <div style="display: flex; align-items: center; gap: 10px;">
        <label for="team-search" style="width: 320px; display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 10px; border-radius: 10px; background: #0b0b0d; box-shadow: inset 0 0 0 1px #70707a;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
          <input id="team-search" type="search" aria-label="Search teams or players" style="flex: 1; min-width: 0; background: transparent; border: 0; color: #f4f4f5; font: inherit; font-size: 13px; outline: none;">
        </label>
        <span class="num" title="Teams" style="font-size: 13px; color: #a1a1aa;">16</span>
      </div>

      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px;">
        <sc-for list="{{teams}}" as="team" hint-placeholder-count="16">
          <section class="pane" style="border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px;">
            <div style="display: flex; align-items: center; gap: 10px; padding: 0 4px 2px;">
              <span style="width: 28px; height: 28px; flex: none; border-radius: 8px; background: #ffffff14; border: 1px solid #ffffff1f; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;">{{team.mono}}</span>
              <h2 style="margin: 0; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{team.name}}</h2>
            </div>
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 8px;">
              <sc-for list="{{team.people}}" as="p" hint-placeholder-count="6">
                <a href="{{p.href}}" target="_blank" rel="noopener" class="p" style="display: flex; align-items: center; gap: 9px; padding: 6px; border-radius: 9px; text-decoration: none; color: #f4f4f5; min-width: 0;">
                  <span style="position: relative; width: 30px; height: 30px; flex: none;">
                    <svg width="30" height="30" viewBox="0 0 40 40" aria-hidden="true" style="display: block; border-radius: 50%; background: #1f1f24; box-shadow: inset 0 0 0 1px #ffffff14;"><circle cx="20" cy="16" r="7" fill="#4a4a53"></circle><path d="M5 40c1.6-9 7.6-13 15-13s13.4 4 15 13z" fill="#4a4a53"></path></svg>
                    <span aria-hidden="true" style="position: absolute; right: -3px; bottom: -3px; width: 13px; height: 13px; border-radius: 50%; background: #09090b; box-shadow: 0 0 0 1px #ffffff2e; font-size: 6px; font-weight: 700; display: flex; align-items: center; justify-content: center;">{{team.mono}}</span>
                  </span>
                  <span style="flex: 0 1 auto; min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{p.handle}}</span>
                  <sc-if value="{{p.coach}}" hint-placeholder-val="{{ false }}">
                    <span role="img" aria-label="Coach" title="Coach" style="flex: none; width: 18px; height: 18px; border-radius: 5px; background: #ffffff14; box-shadow: inset 0 0 0 1px #ffffff26; color: #f4f4f5; display: inline-flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"></path><path d="M22 10v6"></path><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path></svg></span>
                  </sc-if>
                </a>
              </sc-for>
            </div>
          </section>
        </sc-for>
      </div>
    </div>
  </main>

  <svg aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.035; pointer-events: none;"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter><rect width="100%" height="100%" filter="url(#grain)"></rect></svg>
</div>
</x-dc>

</script>
</body>
</html>
