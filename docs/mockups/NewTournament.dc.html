<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New tournament</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#09090b}
.pane{position:relative;background:#ffffff0a;-webkit-backdrop-filter:blur(20px) saturate(140%);backdrop-filter:blur(20px) saturate(140%);box-shadow:0 1px 0 #ffffff0d inset,0 12px 32px #00000059}
.pane::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,#ffffff33,#ffffff1a 40%,#ffffff00 75%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.dialog{position:relative;background:#18181bcc;-webkit-backdrop-filter:blur(32px) saturate(150%);backdrop-filter:blur(32px) saturate(150%);box-shadow:0 1px 0 #ffffff14 inset,0 32px 80px #000000a6}
.dialog::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,#ffffff4d,#ffffff1a 40%,#ffffff00 80%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.num{font-family:"Geist Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
input::placeholder{color:#71717a}
input:focus{outline:2px solid var(--accent);outline-offset:2px}
</style>
</helmet>
<div style="position: relative; min-height: 900px; display: flex; flex-wrap: wrap; align-items: flex-start; align-content: flex-start; font-family: Geist, Inter, system-ui, sans-serif; color: #f4f4f5; background: radial-gradient(70rem 50rem at 0% 0%, #ffb47a14, #ffb47a00 70%), radial-gradient(70rem 50rem at 100% 100%, #ff6a1a1c, #ff6a1a00 70%), #09090b; --accent: {{accent}};">
  <div style="flex: 1 1 100%;">
    <dc-import name="SiteLogo" hint-size="100%,52px"></dc-import>
  </div>
  <main aria-hidden="true" style="flex: 999 1 560px; min-width: 0; padding: 40px 48px; box-sizing: border-box; filter: blur(2px); opacity: .55;">
    <div style="max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px;">
      <div style="height: 36px; width: 200px; border-radius: 10px; background: #ffffff14;"></div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px;">
        <div class="pane" style="height: 330px; border-radius: 16px;"></div>
        <div class="pane" style="height: 330px; border-radius: 16px;"></div>
        <div class="pane" style="height: 330px; border-radius: 16px;"></div>
      </div>
    </div>
  </main>

  <div style="position: absolute; inset: 0; background: #09090b8c; display: flex; align-items: center; justify-content: center; padding: 24px;">
    <div role="dialog" aria-modal="true" aria-labelledby="nt-title" class="dialog" style="width: 100%; max-width: 520px; border-radius: 20px; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <h2 id="nt-title" style="margin: 0; font-size: 19px; line-height: 26px; font-weight: 600; letter-spacing: -0.01em;">New tournament</h2>
        <a href="Main.dc.html" aria-label="Close" title="Close" style="width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #a1a1aa; background: #ffffff0a;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
        </a>
      </div>

      <sc-if value="{{isPaste}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; gap: 10px;">
          <label for="vlr-url" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 0 12px; height: 44px; border-radius: 10px; background: #0f0f12; box-shadow: inset 0 0 0 1px #70707a;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
            <input id="vlr-url" type="url" aria-label="VLR event link" placeholder="vlr.gg/event/…" style="flex: 1; min-width: 0; background: transparent; border: 0; color: #f4f4f5; font: inherit; font-size: 15px;">
          </label>
          <button type="button" style="height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: var(--accent); color: #1c0d02; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: inset 0 1px 0 #ffffff59;">Import</button>
        </div>
      </sc-if>

      <sc-if value="{{showEvent}}" hint-placeholder-val="{{ false }}">
        <div class="pane" style="border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 14px;">
          <div style="width: 48px; height: 48px; flex: none; border-radius: 13px; background: radial-gradient(circle at 50% 30%, #ff7a1a40, #ffffff0d); border: 1px solid #ffffff2e; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 600;">C</div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px;">
            <div style="font-size: 15px; font-weight: 600;">Challengers NA Stage 1</div>
            <div style="display: flex; gap: 6px;">
              <span style="padding: 2px 9px; border-radius: 999px; font-size: 12px; background: #ffffff0d; color: #a1a1aa; box-shadow: inset 0 0 0 1px #ffffff14;">Stage 1</span>
              <span style="padding: 2px 9px; border-radius: 999px; font-size: 12px; background: #ffffff0d; color: #a1a1aa; box-shadow: inset 0 0 0 1px #ffffff14;">Playoffs</span>
            </div>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 12px;">
          <sc-for list="{{steps}}" as="step" hint-placeholder-count="3">
            <div title="{{step.label}}" style="display: flex; align-items: center; gap: 12px;">
              <span style="{{step.iconStyle}}">
                <sc-if value="{{step.isTeams}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path></svg></sc-if>
                <sc-if value="{{step.isMatches}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path></svg></sc-if>
                <sc-if value="{{step.isPlayers}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></sc-if>
                <sc-if value="{{step.isImages}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg></sc-if>
              </span>
              <div style="flex: 1; height: 6px; border-radius: 6px; background: #ffffff14; overflow: hidden;"><div style="{{step.barStyle}}"></div></div>
              <span class="num" style="width: 52px; text-align: right; font-size: 13px; color: #a1a1aa;">{{step.count}}</span>
            </div>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{isDone}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; justify-content: flex-end;">
          <a href="Teams.dc.html" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 10px; background: var(--accent); color: #1c0d02; font-size: 14px; font-weight: 600; text-decoration: none; box-shadow: inset 0 1px 0 #ffffff59;">
            Open
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
          </a>
        </div>
      </sc-if>
    </div>
  </div>

  <svg aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.035; pointer-events: none;"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter><rect width="100%" height="100%" filter="url(#grain)"></rect></svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"step":{"editor":"enum","options":["paste","importing","done"],"default":"importing"},"accent":{"editor":"color","default":"#ff7a1a","options":["#ff7a1a","#ff5c1a","#ff9a3d","#f97316"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#ff7a1a';
    const step = this.props.step ?? 'importing';
    const done = step === 'done';
    const rows = [
      { key: 'teams', label: 'Teams', count: '16/16', pct: 100 },
      { key: 'matches', label: 'Matches', count: '32', pct: 100 },
      { key: 'players', label: 'Players and coaches', count: done ? '96/96' : '41/96', pct: done ? 100 : 43 },
      { key: 'images', label: 'Photos and agents', count: done ? '268' : '—', pct: done ? 100 : 0 },
    ];
    const steps = rows.map((r) => {
      const complete = r.pct === 100;
      return {
        ...r,
        isTeams: r.key === 'teams', isMatches: r.key === 'matches', isPlayers: r.key === 'players', isImages: r.key === 'images',
        iconStyle: 'width: 32px; height: 32px; flex: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; ' +
          (complete ? 'background: ' + accent + '29; color: #ff8f45;' : r.pct > 0 ? 'background: #ffffff12; color: #f4f4f5;' : 'background: #ffffff0a; color: #71717a;'),
        barStyle: 'height: 100%; width: ' + r.pct + '%; border-radius: 6px; background: ' + accent + ';' + (r.pct > 0 && r.pct < 100 ? ' box-shadow: 0 0 12px ' + accent + '99;' : ''),
      };
    });
    return { accent, isPaste: step === 'paste', showEvent: step !== 'paste', isDone: done, steps };
  }
}
</script>
</body>
</html>
