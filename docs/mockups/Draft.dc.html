<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Draft room</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#09090b}
.pane{position:relative;background:#ffffff0a;-webkit-backdrop-filter:blur(20px) saturate(140%);backdrop-filter:blur(20px) saturate(140%);box-shadow:0 1px 0 #ffffff0d inset,0 12px 32px #00000059}
.pane::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,#ffffff33,#ffffff1a 40%,#ffffff00 75%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.strong{background:#ffffff12;-webkit-backdrop-filter:blur(32px) saturate(150%);backdrop-filter:blur(32px) saturate(150%)}
.dense{background:#141417e0}
.num{font-family:"Geist Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.ib{width:34px;height:34px;border-radius:10px;border:0;background:#ffffff0a;color:#a1a1aa;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ib:hover{background:#ffffff14;color:#f4f4f5}
.prow{cursor:pointer;transition:background .15s}
.prow:hover{background:#ffffff0a}
.prow .ext{opacity:0;transition:opacity .15s}
.prow:hover .ext{opacity:1}
@keyframes breathe{0%,100%{box-shadow:0 0 0 2px var(--accent),0 0 14px color-mix(in srgb,var(--accent) 55%,transparent)}50%{box-shadow:0 0 0 2px var(--accent),0 0 26px color-mix(in srgb,var(--accent) 85%,transparent)}}
.clock{animation:breathe 2.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.clock{animation:none}}
</style>
</helmet>
<div style="position: relative; min-height: 1000px; display: flex; flex-wrap: wrap; align-items: flex-start; align-content: flex-start; font-family: Geist, Inter, system-ui, sans-serif; color: #f4f4f5; background: radial-gradient(70rem 50rem at 0% 0%, #ffb47a14, #ffb47a00 70%), radial-gradient(70rem 50rem at 100% 100%, #ff6a1a1c, #ff6a1a00 70%), #09090b; --accent: {{accent}};">
  <div style="flex: 1 1 100%;">
    <dc-import name="SiteLogo" hint-size="100%,52px"></dc-import>
  </div>

  <main style="flex: 999 1 560px; min-width: 0; padding: 32px 32px 40px; box-sizing: border-box;">
    <div style="max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px;">
      <dc-import name="TournamentHeader" tab="draft" hint-size="100%,110px"></dc-import>

      <!-- on-the-clock bar -->
      <div class="pane strong" style="border-radius: 16px; padding: 12px 16px; display: flex; align-items: center; gap: 18px;">
        <div role="tablist" aria-label="Stage" style="display: inline-flex; gap: 3px; padding: 3px; border-radius: 10px; background: #00000033; box-shadow: inset 0 0 0 1px #ffffff12;">
          <button type="button" role="tab" aria-selected="true" style="padding: 5px 11px; border-radius: 7px; border: 0; font: inherit; font-size: 13px; font-weight: 600; color: #f4f4f5; background: #ffffff17; box-shadow: inset 1px 1px 0 #ffffff47, inset 0 0 0 1px #ffffff1a, 0 4px 12px #00000066; cursor: pointer;">Stage 1</button>
          <button type="button" role="tab" aria-selected="false" style="padding: 5px 11px; border-radius: 7px; border: 0; font: inherit; font-size: 13px; font-weight: 600; color: #a1a1aa; background: transparent; cursor: pointer;">Playoffs</button>
        </div>
        <div style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 14px;">
          <sc-if value="{{showClock}}" hint-placeholder-val="{{ true }}">
            <span class="clock" title="{{clockName}}" style="width: 30px; height: 30px; border-radius: 50%; background: #2a2a30; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600;">{{clockInitial}}</span>
            <span class="num" style="font-size: 22px; font-weight: 600; letter-spacing: -0.02em; color: {{clockTimeColor}};">{{clockTime}}</span>
          </sc-if>
          <sc-if value="{{isComplete}}" hint-placeholder-val="{{ false }}">
            <span title="Draft complete" style="width: 30px; height: 30px; border-radius: 50%; background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent);">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
            </span>
          </sc-if>
          <div aria-label="Rounds" style="display: flex; align-items: center; gap: 5px;">
            <sc-for list="{{rounds}}" as="r" hint-placeholder-count="6">
              <span style="{{r.style}}"></span>
            </sc-for>
            <span title="Swap phase" style="{{swapDotStyle}}">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3 4 7l4 4"></path><path d="M4 7h16"></path><path d="m16 21 4-4-4-4"></path><path d="M20 17H4"></path></svg>
            </span>
          </div>
        </div>
        <sc-if value="{{canLock}}" hint-placeholder-val="{{ false }}">
          <button type="button" style="display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 14px; border-radius: 9px; border: 0; background: var(--accent); color: #1c0d02; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: inset 0 1px 0 #ffffff59, 0 6px 18px color-mix(in srgb, var(--accent) 35%, transparent);">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            Lock
          </button>
        </sc-if>
        <div aria-label="Commissioner" style="display: flex; gap: 4px; padding-left: 10px; border-left: 1px solid #ffffff14;">
          <button type="button" class="ib" aria-label="Pause" title="Pause"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="14" y="4" width="4" height="16" rx="1"></rect><rect x="6" y="4" width="4" height="16" rx="1"></rect></svg></button>
          <button type="button" class="ib" aria-label="Undo" title="Undo"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"></path><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"></path></svg></button>
          <button type="button" class="ib" aria-label="Act as manager" title="Act as manager"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><polyline points="16 11 18 13 22 9"></polyline></svg></button>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 18px; align-items: start;">
        <!-- board: one row per manager, in seat order -->
        <section class="pane" aria-label="Draft board" style="grid-column: span 7; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px;">
          <div aria-hidden="true" style="display: grid; grid-template-columns: 34px repeat(5, minmax(0, 1fr)) minmax(0, 1fr); gap: 8px; padding: 0 8px 2px; font-size: 12px; color: #71717a;">
            <span></span>
            <span class="num" style="text-align: center;">1</span><span class="num" style="text-align: center;">2</span><span class="num" style="text-align: center;">3</span><span class="num" style="text-align: center;">4</span><span class="num" style="text-align: center;">5</span>
            <span style="display: flex; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"></path><path d="M22 10v6"></path><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path></svg></span>
          </div>
          <sc-for list="{{rows}}" as="row" hint-placeholder-count="8">
            <div style="{{row.wrapStyle}}">
              <span title="{{row.name}}" style="{{row.avatarStyle}}">{{row.initial}}
                <sc-if value="{{row.locked}}" hint-placeholder-val="{{ false }}">
                  <span title="Locked" style="position: absolute; right: -4px; bottom: -4px; width: 14px; height: 14px; border-radius: 50%; background: #09090b; box-shadow: 0 0 0 1px #ffffff2e; display: flex; align-items: center; justify-content: center; color: #f4f4f5;">
                    <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                  </span>
                </sc-if>
              </span>
              <sc-for list="{{row.cells}}" as="cell" hint-placeholder-count="6">
                <div style="{{cell.style}}">
                  <sc-if value="{{cell.filled}}" hint-placeholder-val="{{ true }}">
                    <span style="position: relative; width: 26px; height: 26px; flex: none;">
                      <svg width="26" height="26" viewBox="0 0 40 40" aria-hidden="true" style="display: block; border-radius: 50%; background: #1f1f24;"><circle cx="20" cy="16" r="7" fill="#4a4a53"></circle><path d="M5 40c1.6-9 7.6-13 15-13s13.4 4 15 13z" fill="#4a4a53"></path></svg>
                      <span aria-hidden="true" style="position: absolute; right: -3px; bottom: -3px; width: 13px; height: 13px; border-radius: 50%; background: #09090b; box-shadow: 0 0 0 1px #ffffff2e; font-size: 7px; font-weight: 700; display: flex; align-items: center; justify-content: center;">{{cell.team}}</span>
                    </span>
                    <span style="flex: 1; min-width: 0; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{cell.handle}}</span>
                  </sc-if>
                </div>
              </sc-for>
            </div>
          </sc-for>
        </section>

        <!-- pool -->
        <section class="pane dense" aria-label="Available" style="grid-column: span 5; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
          <div style="display: flex; gap: 8px;">
            <label for="pool-search" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border-radius: 10px; background: #0b0b0d; box-shadow: inset 0 0 0 1px #70707a;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
              <input id="pool-search" type="search" aria-label="Search players or teams" style="flex: 1; min-width: 0; background: transparent; border: 0; color: #f4f4f5; font: inherit; font-size: 13px; outline: none;">
              <kbd class="num" style="font-size: 10px; color: #a1a1aa; padding: 0 5px; border-radius: 4px; box-shadow: inset 0 0 0 1px #ffffff26;">/</kbd>
            </label>
            <div role="radiogroup" aria-label="Kind" style="display: inline-flex; gap: 2px; padding: 2px; border-radius: 10px; background: #00000040; box-shadow: inset 0 0 0 1px #ffffff12;">
              <button type="button" role="radio" aria-checked="true" aria-label="Players" title="Players" style="width: 34px; height: 30px; border-radius: 8px; border: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #f4f4f5; background: #ffffff17; box-shadow: inset 1px 1px 0 #ffffff47, inset 0 0 0 1px #ffffff1a, 0 4px 12px #00000066;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></button>
              <button type="button" role="radio" aria-checked="false" aria-label="Coaches" title="Coaches" style="width: 34px; height: 30px; border-radius: 8px; border: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #a1a1aa; background: transparent;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"></path><path d="M22 10v6"></path><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path></svg></button>
            </div>
          </div>

          <div role="group" aria-label="Teams" style="display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 4px;">
            <sc-for list="{{teamFilters}}" as="tf" hint-placeholder-count="16">
              <button type="button" aria-pressed="{{tf.pressed}}" title="{{tf.name}}" aria-label="{{tf.name}}" style="{{tf.style}}">{{tf.mono}}</button>
            </sc-for>
          </div>

          <div role="table" aria-label="Available" style="display: flex; flex-direction: column;">
            <div role="row" style="display: grid; grid-template-columns: minmax(0, 1fr) 48px 44px 44px; gap: 8px; padding: 2px 8px 8px; border-bottom: 1px solid #ffffff12; font-size: 11px; font-weight: 600; letter-spacing: .05em; color: #a1a1aa;">
              <span role="columnheader">PLAYER</span>
              <span role="columnheader" aria-sort="descending" style="text-align: right; color: #ff8f45;">RTG ▾</span>
              <span role="columnheader" style="text-align: right;">ACS</span>
              <span role="columnheader" style="text-align: right;">K/D</span>
            </div>
            <sc-for list="{{pool}}" as="p" hint-placeholder-count="12">
              <div role="row" class="prow" style="{{p.rowStyle}}">
                <span role="cell" style="display: flex; align-items: center; gap: 8px; min-width: 0;">
                  <span style="position: relative; width: 28px; height: 28px; flex: none;">
                    <svg width="28" height="28" viewBox="0 0 40 40" aria-hidden="true" style="display: block; border-radius: 50%; background: #1f1f24;"><circle cx="20" cy="16" r="7" fill="#4a4a53"></circle><path d="M5 40c1.6-9 7.6-13 15-13s13.4 4 15 13z" fill="#4a4a53"></path></svg>
                    <span aria-hidden="true" style="position: absolute; right: -3px; bottom: -3px; width: 14px; height: 14px; border-radius: 50%; background: #09090b; box-shadow: 0 0 0 1px #ffffff2e; font-size: 7px; font-weight: 700; display: flex; align-items: center; justify-content: center;">{{p.team}}</span>
                  </span>
                  <span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{p.handle}}</span>
                  <span style="display: flex; gap: 2px;">
                    <sc-for list="{{p.agents}}" as="ag" hint-placeholder-count="3">
                      <span title="{{ag}}" style="width: 16px; height: 16px; border-radius: 4px; background: #ffffff10; box-shadow: inset 0 0 0 1px #ffffff1f; font-size: 7px; font-weight: 600; color: #a1a1aa; display: flex; align-items: center; justify-content: center;">{{ag}}</span>
                    </sc-for>
                  </span>
                  <a href="https://www.vlr.gg/" target="_blank" rel="noopener" class="ext" aria-label="Open on VLR" title="Open on VLR" style="color: #a1a1aa; display: flex;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg></a>
                  <sc-if value="{{p.showAction}}" hint-placeholder-val="{{ false }}">
                    <button type="button" style="margin-left: auto; height: 28px; padding: 0 12px; border-radius: 8px; border: 0; background: var(--accent); color: #1c0d02; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; box-shadow: inset 0 1px 0 #ffffff59;">{{actionLabel}}</button>
                  </sc-if>
                </span>
                <span role="cell" class="num" style="text-align: right; font-size: 13px; font-weight: 600;">{{p.rtg}}</span>
                <span role="cell" class="num" style="text-align: right; font-size: 13px; color: #a1a1aa;">{{p.acs}}</span>
                <span role="cell" class="num" style="text-align: right; font-size: 13px; color: #a1a1aa;">{{p.kd}}</span>
              </div>
            </sc-for>
          </div>
        </section>
      </div>

      <!-- recent actions -->
      <div class="pane" aria-label="Recent" style="border-radius: 14px; padding: 12px 16px; display: flex; align-items: center; gap: 20px; overflow: hidden;">
        <sc-for list="{{recent}}" as="ev" hint-placeholder-count="8">
          <span style="display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 12px;">
            <span style="{{ev.avatarStyle}}">{{ev.initial}}</span>
            <span style="color: {{ev.iconColor}}; display: flex;">
              <sc-if value="{{ev.isPick}}" hint-placeholder-val="{{ true }}"><svg width="8" height="8" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="4" fill="currentColor"></circle></svg></sc-if>
              <sc-if value="{{ev.isSwap}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3 4 7l4 4"></path><path d="M4 7h16"></path><path d="m16 21 4-4-4-4"></path><path d="M20 17H4"></path></svg></sc-if>
              <sc-if value="{{ev.isLock}}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></sc-if>
            </span>
            <span style="color: #f4f4f5; font-weight: 600;">{{ev.text}}</span>
            <sc-if value="{{ev.auto}}" hint-placeholder-val="{{ false }}"><span title="Timed out" style="color: #a1a1aa; display: flex;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg></span></sc-if>
          </span>
        </sc-for>
      </div>
    </div>
  </main>

  <svg aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.035; pointer-events: none;"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter><rect width="100%" height="100%" filter="url(#grain)"></rect></svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"phase":{"editor":"enum","options":["draft","swap","complete"],"default":"draft"},"yourTurn":{"editor":"boolean","default":true},"accent":{"editor":"color","default":"#ff7a1a","options":["#ff7a1a","#ff5c1a","#ff9a3d","#f97316"]},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#ff7a1a';
    const phase = this.props.phase ?? 'draft';
    const yourTurn = this.props.yourTurn ?? true;
    const P = (s) => { const [handle, team] = s.split(':'); return { handle, team }; };
    const seats = [
      ['Jackey', '#95deae'], ['Amy', '#fab0d9'], ['Will', '#f5bf81'], ['Stephen', '#5b9ddf'],
      ['James', '#cfbeff'], ['Terrance', '#72dee4'], ['Joseph', '#ffb1aa'], ['Kai', '#c8d386'],
    ];
    const full = [
      ['Less:L Ethan:N trent:G Cryocells:1 s0m:N', 'bzkA:L'],
      ['leaf:G kiNgg:V Mazino:V tuyz:L eeiu:1', 'Leviatán Coach:V'],
      ['Asuna:1 mada:N jawgemo:G C0M:V JonahP:G', 'Mikes:1'],
      ['zekken:S johnqt:S Saadhak:L brawk:N Boostio:1', 'kaplan:S'],
      ['aspas:M OXY:C Derrek:E khalil:F Verno:M', 'mCe:C'],
      ['v1c:C supamen:E mwzera:F artzin:M Xeppaa:C', 'Potter:E'],
      ['koalanoob:8 nitr0:8 gMd:T seven:T Melser:K', 'fRoD:M'],
      ['Reduxx:O mitch:O penny:Y keznit:K runi:C', 'YFP Coach:Y'],
    ].map(([p, c]) => ({ players: p.split(' ').map(P), coach: P(c) }));

    let rosters, onClock = null, locked = {}, recent;
    if (phase === 'draft') {
      const take = [3, 3, 3, yourTurn ? 2 : 3, 2, 2, 2, 2];
      rosters = full.map((r, i) => ({ players: r.players.slice(0, take[i]), coach: null }));
      onClock = yourTurn ? 3 : 4;
      recent = [['K', 'pick', 'mitch'], ['Jo', 'pick', 'nitr0'], ['T', 'pick', 'supamen', true], ['Ja', 'pick', 'OXY'], ['S', 'pick', 'johnqt'], ['J', 'pick', 'trent'], ['A', 'pick', 'Mazino'], ['W', 'pick', 'jawgemo']]
        .concat(yourTurn ? [] : [['S', 'pick', 'Saadhak']]).slice(-8);
    } else {
      rosters = full;
      if (phase === 'swap') { locked = { 1: true, 6: true }; onClock = yourTurn ? 3 : 4; }
      else { locked = { 0: true, 1: true, 2: true, 3: true, 4: true, 5: true, 6: true, 7: true }; }
      recent = phase === 'swap'
        ? [['K', 'pick', 'YFP Coach'], ['Jo', 'lock', 'Joseph'], ['A', 'lock', 'Amy', true], ['J', 'swap', 'trent'], ['W', 'swap', 'JonahP']]
        : [['S', 'lock', 'Stephen'], ['Ja', 'swap', 'Verno'], ['Ja', 'lock', 'James'], ['T', 'lock', 'Terrance', true], ['K', 'lock', 'Kai']];
    }
    const swapSelected = phase === 'swap' && yourTurn ? 'johnqt' : null;

    const cellBase = 'height: 40px; box-sizing: border-box; border-radius: 9px; display: flex; align-items: center; gap: 8px; padding: 0 8px; min-width: 0; ';
    const empty = 'box-shadow: inset 0 0 0 1px #ffffff1a; background: #ffffff03;';
    const next = 'background: color-mix(in srgb, ' + accent + ' 16%, transparent); box-shadow: inset 0 0 0 1px ' + accent + ', 0 0 14px color-mix(in srgb, ' + accent + ' 40%, transparent);';
    const rows = seats.map(([name, color], i) => {
      const r = rosters[i];
      const isClock = onClock === i;
      const tint = 'background: color-mix(in srgb, ' + color + ' 15%, #ffffff05); box-shadow: inset 0 0 0 1px color-mix(in srgb, ' + color + ' 40%, transparent);';
      let nextMarked = !(isClock && phase === 'draft');
      const cells = [];
      for (let k = 0; k < 5; k++) {
        const p = r.players[k];
        let style;
        if (p) style = cellBase + tint + (p.handle === swapSelected ? ' box-shadow: inset 0 0 0 2px ' + accent + ', 0 0 14px color-mix(in srgb, ' + accent + ' 45%, transparent);' : '');
        else if (!nextMarked) { style = cellBase + next; nextMarked = true; }
        else style = cellBase + empty;
        cells.push({ filled: !!p, handle: p ? p.handle : '', team: p ? p.team : '', style });
      }
      const c = r.coach;
      cells.push({ filled: !!c, handle: c ? c.handle : '', team: c ? c.team : '', style: cellBase + 'margin-left: 6px; ' + (c ? tint : empty) });
      return {
        name, initial: name[0], locked: !!locked[i], cells,
        wrapStyle: 'display: grid; grid-template-columns: 34px repeat(5, minmax(0, 1fr)) minmax(0, 1fr); gap: 8px; align-items: center; padding: 5px 8px; border-radius: 12px; ' +
          (isClock ? 'background: color-mix(in srgb, ' + accent + ' 8%, transparent);' : '') + (locked[i] && phase === 'swap' ? ' opacity: .5;' : ''),
        avatarStyle: 'position: relative; width: 30px; height: 30px; border-radius: 50%; background: #2a2a30; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; box-shadow: 0 0 0 2px #131315, 0 0 0 3.5px ' + color + (isClock ? ', 0 0 0 6px ' + accent + ', 0 0 18px ' + accent + '99' : '') + ';',
      };
    });

    const owned = {};
    rosters.forEach((r) => { r.players.forEach((p) => { owned[p.handle] = true; }); if (r.coach) owned[r.coach.handle] = true; });
    const candidates = [
      'valyn:G:Om Vi As:1.21:228:1.31', 'Saadhak:L:Ky Sk Br:1.19:211:1.24', 'Sacy:S:So Fa Br:1.17:205:1.22', 'nzr:F:So Fa Ky:1.15:199:1.18',
      'cauanzin:L:So Fa Br:1.12:198:1.15', 'bang:1:Om As Cl:1.09:201:1.08', 'heat:K:Je Ra Ne:1.08:224:1.07', 'qck:L:Ra Je Ne:1.06:219:1.04',
      'skuba:N:Vi Ha Cy:1.05:187:1.03', 'Tacolilla:V:Om Vi As:1.02:189:0.98', 'N4RRATE:S:Ra Ne Yo:1.01:207:0.97', 'Zellsis:S:Ky Br Fa:1.00:195:0.96',
      'havoc:F:Ki Cy Ch:0.99:190:0.95', 'zander:8:Om Vi Ha:0.98:184:0.94',
    ];
    const canAct = yourTurn && phase !== 'complete';
    const pool = candidates.map((s) => { const [handle, team, ag, rtg, acs, kd] = s.split(':'); return { handle, team, agents: ag.split(' '), rtg, acs, kd }; })
      .filter((c) => !owned[c.handle]).slice(0, 11)
      .map((c, i) => ({
        ...c,
        showAction: canAct && i === 0,
        rowStyle: 'display: grid; grid-template-columns: minmax(0, 1fr) 48px 44px 44px; gap: 8px; align-items: center; height: 42px; padding: 0 8px; border-radius: 10px; ' +
          (canAct && i === 0 ? 'background: color-mix(in srgb, ' + accent + ' 12%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, ' + accent + ' 50%, transparent);' : ''),
      }));

    const roundNow = phase === 'draft' ? 2 : 6;
    const rounds = [0, 1, 2, 3, 4, 5].map((k) => ({
      style: 'width: 7px; height: 7px; border-radius: 50%; ' +
        (k < roundNow ? 'background: ' + accent + ';' : k === roundNow && phase === 'draft' ? 'box-shadow: inset 0 0 0 2px ' + accent + ';' : 'background: #ffffff1f;'),
    }));
    const filters = [['Sentinels', 'S', 1], ['G2 Esports', 'G', 1], ['NRG', 'N'], ['100 Thieves', '1'], ['LOUD', 'L'], ['Leviatán', 'V'], ['Cloud9', 'C'], ['Evil Geniuses', 'E'], ['MIBR', 'M'], ['FURIA', 'F'], ['KRÜ Esports', 'K'], ['2GAME Esports', '2'], ['M80', '8'], ['TSM', 'T'], ['Oxygen', 'O'], ['YFP', 'Y']];
    const teamFilters = filters.map(([name, mono, on]) => ({
      name, mono, pressed: on ? 'true' : 'false',
      style: 'height: 30px; border-radius: 8px; border: 0; padding: 0; font: inherit; font-size: 10px; font-weight: 700; cursor: pointer; ' +
        (on ? 'color: #f4f4f5; background: #ffffff1f; box-shadow: inset 0 0 0 1px #ffffff47;' : 'color: #a1a1aa; background: #ffffff08; box-shadow: inset 0 0 0 1px #ffffff12;'),
    }));
    const colorOf = { J: '#95deae', A: '#fab0d9', W: '#f5bf81', S: '#5b9ddf', Ja: '#cfbeff', T: '#72dee4', Jo: '#ffb1aa', K: '#c8d386' };
    const recentOut = recent.map(([who, kind, text, auto]) => ({
      initial: who[0], text, auto: !!auto,
      isPick: kind === 'pick', isSwap: kind === 'swap', isLock: kind === 'lock',
      iconColor: kind === 'pick' ? '#a1a1aa' : kind === 'swap' ? accent : '#f4f4f5',
      avatarStyle: 'width: 20px; height: 20px; border-radius: 50%; background: #2a2a30; color: #f4f4f5; font-size: 9px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 0 0 1.5px ' + colorOf[who] + ';',
    }));
    const clock = onClock !== null ? seats[onClock][0] : '';
    return {
      accent, rows, pool, rounds, teamFilters, recent: recentOut,
      showClock: phase !== 'complete',
      isComplete: phase === 'complete',
      clockName: clock, clockInitial: clock ? clock[0] : '',
      clockTime: yourTurn ? '0:42' : '1:07',
      clockTimeColor: yourTurn ? '#f4f4f5' : '#a1a1aa',
      swapDotStyle: 'width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-left: 3px; ' +
        (phase !== 'draft' ? 'color: #1c0d02; background: ' + accent + ';' : 'color: #a1a1aa; box-shadow: inset 0 0 0 1.5px #ffffff26;'),
      canLock: phase === 'swap' && !locked[3] && yourTurn,
      actionLabel: phase === 'swap' ? 'Swap' : 'Pick',
    };
  }
}
</script>
